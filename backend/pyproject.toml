[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manta-zombie-backend"
version = "0.3.0"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.4", "networkx==3.4.2", "httpx==0.28.1", "sniffio==1.3.1", "uvicorn==0.34.2", "PyYAML==6.0.2"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
maps = ["osmnx==2.0.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
