name: manta-zombie-escape

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      API_KEY_FILE: /run/secrets/api_key
      ROUTING_STRATEGY: ${ROUTING_STRATEGY:-pro}
      SEED: ${SEED:-7}
      TURN_SECONDS: ${TURN_SECONDS:-2}
      HTTP_CONCURRENCY: ${HTTP_CONCURRENCY:-4}
      PRO_PREDICTION: ${PRO_PREDICTION:-true}
      PRO_RESERVATIONS: ${PRO_RESERVATIONS:-true}
      PRO_FLEET: ${PRO_FLEET:-true}
      MANTA_DATA_DIR: /service/data
    secrets:
      - api_key
    networks:
      - simulation
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    deploy:
      replicas: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080
    networks:
      - web
      - simulation
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/health']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  web:
  simulation:
    internal: true

secrets:
  api_key:
    file: ${API_KEY_SECRET_FILE:-./.secrets/api_key}
