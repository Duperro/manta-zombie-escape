worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format safe '$remote_addr "$request_method $uri" $status $request_time';
    access_log /dev/stdout safe;
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $uri $cache_policy {
        default no-cache;
        /api/estado no-store;
        /paso no-store;
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    # Controles de prueba de fuego desde la página: máximo 10 peticiones/min por IP
    # (frena a quien intente adivinar la clave). El backend valida x-api-key.
    limit_req_zone $binary_remote_addr zone=control:1m rate=10r/m;
    limit_req_status 429;

    upstream simulation {
        zone simulation 64k;
        server backend:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 16k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 15s;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass only the client's credential. Nginx has no access to the secret.
        proxy_set_header x-api-key $http_x_api_key;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        # OSM requires a valid browser Referer; send only the origin cross-site.
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $cache_policy always;

        location = /api/health {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass http://simulation/health;
        }
        location = /api/estado {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass http://simulation/estado;
        }
        location = /api/mapa {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass http://simulation/mapa;
        }
        location = /paso {
            if ($request_method != POST) { return 405; }
            proxy_pass http://simulation/paso;
        }
        location = /api/control/estado {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            limit_req zone=control burst=10 nodelay;
            proxy_pass http://simulation/control/estado;
        }
        location = /api/control/iniciar {
            if ($request_method != POST) { return 405; }
            limit_req zone=control burst=5 nodelay;
            proxy_pass http://simulation/control/iniciar;
        }
        # /control/dormidos sigue bloqueado: revela zombies ocultos.
        location ^~ /api/ { return 404; }
        location ^~ /control { return 404; }
        location = /api { return 404; }
        location ^~ /paso/ { return 404; }
        location ^~ /docs { return 404; }
        location ^~ /redoc { return 404; }
        location = /openapi.json { return 404; }
        location ~ (^|/)\. { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
